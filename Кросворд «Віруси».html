<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Кросворд «Віруси»</title>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600&family=Unbounded:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef5f2;--ink:#12302a;--cell:#fff;--line:#7aa597;--hl:#cfe9df;--sel:#ffd6e8;--acc:#c2185b;--ok:#1b7f55;--bad:#c62828;--mut:#4d6b63;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1f1b;--ink:#e3f2ec;--cell:#16302a;--line:#3f6b5e;--hl:#1f4a3f;--sel:#6b2146;--acc:#ff7eb6;--ok:#5fd6a0;--bad:#ff8a80;--mut:#9fc0b5}}
:root[data-theme="dark"]{--bg:#0e1f1b;--ink:#e3f2ec;--cell:#16302a;--line:#3f6b5e;--hl:#1f4a3f;--sel:#6b2146;--acc:#ff7eb6;--ok:#5fd6a0;--bad:#ff8a80;--mut:#9fc0b5}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Onest,system-ui,sans-serif;padding:16px}
h1{font:600 22px/1.2 Unbounded,Onest,sans-serif;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
button{font:600 14px Onest,sans-serif;padding:8px 14px;border-radius:8px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
#msg{align-self:center;color:var(--mut);font-size:14px}
.gw{overflow-x:auto;max-width:100%;padding-bottom:6px}
#grid{display:grid;gap:0;width:max-content}
.c{position:relative;width:30px;height:30px}
.c input{width:100%;height:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--cell);color:var(--ink);text-align:center;font:600 16px Onest,sans-serif;text-transform:uppercase;padding:6px 0 0;margin:0;border-radius:0;caret-color:transparent}
.c.hl input{background:var(--hl)}.c.sel input{background:var(--sel)}
.c.ok input{color:var(--ok)}.c.bad input{color:var(--bad)}
.c i{position:absolute;top:1px;left:2px;font:normal 600 9px/1 Onest,sans-serif;color:var(--mut);pointer-events:none}
.cl{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:8px 28px;margin-top:18px}
h2{font:600 15px Unbounded,Onest,sans-serif;margin:0 0 8px}
ol{list-style:none;margin:0;padding:0}
li{padding:5px 8px;border-radius:6px;cursor:pointer;font-size:15px}
li b{display:inline-block;min-width:26px;color:var(--acc)}
li.on{background:var(--hl)}
li small{color:var(--mut)}
.wm{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}.wm span{position:absolute;white-space:nowrap;transform:rotate(-25deg);font:600 18px Onest,sans-serif;color:var(--ink);opacity:.07}
.by{margin:22px 0 0;color:var(--mut);font-size:14px}
@media print{.wm span{opacity:.15}}
</style></head><body>
<h1>Кросворд «Віруси»</h1>
<p class="sub">18 слів. Натисніть на клітинку або запитання й вписуйте літери.</p>
<div class="bar"><button id="chk">Перевірити</button><button id="hint">Підказка</button><button id="rev">Показати відповіді</button><button id="clr">Почати знову</button><span id="msg"></span></div>
<div class="gw"><div id="grid"></div></div>
<div class="cl"><section><h2>По горизонталі</h2><ol id="la"></ol></section><section><h2>По вертикалі</h2><ol id="ld"></ol></section></div>
<p class="by">Автор: Акім Мамонтов, 9-Б</p>
<div class="wm" id="wm" aria-hidden="true"></div>
<script>
const D={"W": 18, "H": 21, "e": [{"n": 8, "d": "a", "x": 3, "y": 7, "w": "БАКТЕРІОФАГ", "c": "Вірус, що вражає бактерій"}, {"n": 9, "d": "d", "x": 12, "y": 7, "w": "АНТИТІЛО", "c": "Білок імунної системи, що зв'язує чужорідний антиген"}, {"n": 10, "d": "a", "x": 5, "y": 9, "w": "ІМУНІТЕТ", "c": "Здатність організму захищатися від інфекцій"}, {"n": 13, "d": "a", "x": 5, "y": 12, "w": "КОРОНАВІРУС", "c": "Група вірусів, до якої належить збудник COVID-19"}, {"n": 12, "d": "d", "x": 9, "y": 11, "w": "ІНТЕРФЕРОН", "c": "Білок, який клітина виробляє у відповідь на вірусну інфекцію"}, {"n": 2, "d": "d", "x": 4, "y": 1, "w": "ВАКЦИНА", "c": "Препарат, що формує імунітет до збудника"}, {"n": 3, "d": "a", "x": 1, "y": 2, "w": "ГЕПАТИТ", "c": "Запалення печінки, часто вірусного походження"}, {"n": 17, "d": "a", "x": 4, "y": 18, "w": "ПАСТЕР", "c": "Французький учений, що створив вакцину проти сказу"}, {"n": 18, "d": "a", "x": 4, "y": 20, "w": "ХАЗЯЇН", "c": "Організм, у клітинах якого паразитує вірус"}, {"n": 7, "d": "a", "x": 0, "y": 5, "w": "КАПСИД", "c": "Білкова оболонка, що захищає геном вірусу"}, {"n": 11, "d": "d", "x": 14, "y": 9, "w": "ІНКУБАЦІЯ", "c": "Період від зараження до появи перших симптомів"}, {"n": 4, "d": "d", "x": 10, "y": 3, "w": "ПОЛІО", "c": "Вірусна хвороба, що може спричинити параліч"}, {"n": 6, "d": "a", "x": 7, "y": 4, "w": "ГЕНОМ", "c": "Сукупність спадкового матеріалу вірусу"}, {"n": 15, "d": "d", "x": 5, "y": 14, "w": "ЕБОЛА", "c": "Небезпечна геморагічна лихоманка африканського походження"}, {"n": 5, "d": "d", "x": 0, "y": 4, "w": "СКАЗ", "c": "Смертельна вірусна хвороба, що передається через укус тварин"}, {"n": 1, "d": "d", "x": 6, "y": 0, "w": "ГРИП", "c": "Сезонна вірусна хвороба з температурою та ломотою"}, {"n": 16, "d": "a", "x": 13, "y": 16, "w": "ВІРУС", "c": "Неклітинний інфекційний агент, що розмножується лише в живих клітинах"}, {"n": 14, "d": "d", "x": 7, "y": 12, "w": "РНК", "c": "Нуклеїнова кислота, що є геномом багатьох вірусів (абревіатура)"}]};
const g=document.getElementById('grid');g.style.gridTemplateColumns=`repeat(${D.W},30px)`;
const cells={},byKey={};let cur=null,dir='a';
const key=(x,y)=>x+','+y;
D.e.forEach(e=>{for(let i=0;i<e.w.length;i++){const x=e.x+(e.d=='a'?i:0),y=e.y+(e.d=='d'?i:0),k=key(x,y);(byKey[k]=byKey[k]||{x,y,a:null,d:null,ch:e.w[i]})[e.d]=e;}});
for(let y=0;y<D.H;y++)for(let x=0;x<D.W;x++){const k=key(x,y),c=document.createElement('div');
 if(byKey[k]){c.className='c';const inp=document.createElement('input');inp.maxLength=2;inp.autocomplete='off';inp.setAttribute('aria-label','Клітинка '+(x+1)+','+(y+1));
  inp.inputMode='text';c.appendChild(inp);const s=D.e.find(e=>e.x==x&&e.y==y);if(s){const n=document.createElement('i');n.textContent=s.n;c.appendChild(n)}
  cells[k]={c,inp,x,y};
  inp.addEventListener('focus',()=>select(x,y));
  inp.addEventListener('mousedown',()=>{if(cur&&cur.x==x&&cur.y==y&&byKey[k].a&&byKey[k].d){dir=dir=='a'?'d':'a';setTimeout(()=>select(x,y),0)}});
  inp.addEventListener('input',()=>{const v=[...inp.value.toUpperCase().replace(/[^А-ЯІЇЄҐ]/g,'')].pop()||'';inp.value=v;clearMarks();if(v)step(1)});
  inp.addEventListener('keydown',ev=>{const m={ArrowRight:[1,0],ArrowLeft:[-1,0],ArrowDown:[0,1],ArrowUp:[0,-1]}[ev.key];
   if(m){ev.preventDefault();const t=cells[key(x+m[0],y+m[1])];if(t){dir=m[0]?'a':'d';t.inp.focus()}}
   else if(ev.key=='Backspace'&&!inp.value){ev.preventDefault();step(-1)}
   else if(ev.key==' '||ev.key=='Tab'&&false){ev.preventDefault();dir=dir=='a'?'d':'a';select(x,y)}});
 }
 g.appendChild(c)}
function entryAt(x,y){const b=byKey[key(x,y)];return b[dir]||b[dir=='a'?'d':'a']}
function cellsOf(e){return[...e.w].map((_,i)=>cells[key(e.x+(e.d=='a'?i:0),e.y+(e.d=='d'?i:0))])}
function select(x,y){const b=byKey[key(x,y)];if(!b[dir])dir=dir=='a'?'d':'a';cur={x,y};const e=b[dir];
 Object.values(cells).forEach(o=>o.c.classList.remove('hl','sel'));cellsOf(e).forEach(o=>o.c.classList.add('hl'));cells[key(x,y)].c.classList.add('sel');
 document.querySelectorAll('li.on').forEach(l=>l.classList.remove('on'));const li=document.getElementById('q'+e.n+e.d);if(li)li.classList.add('on')}
function step(n){const e=entryAt(cur.x,cur.y),l=cellsOf(e),i=l.findIndex(o=>o.x==cur.x&&o.y==cur.y),t=l[i+n];if(t)t.inp.focus()}
function clearMarks(){Object.values(cells).forEach(o=>o.c.classList.remove('ok','bad'));msg('')}
function msg(t){document.getElementById('msg').textContent=t}
['a','d'].forEach(d=>{const ol=document.getElementById('l'+d);D.e.filter(e=>e.d==d).sort((a,b)=>a.n-b.n).forEach(e=>{const li=document.createElement('li');li.id='q'+e.n+e.d;
 li.innerHTML=`<b>${e.n}.</b>${e.c} <small>(${e.w.length})</small>`;li.onclick=()=>{dir=d;cells[key(e.x,e.y)].inp.focus();select(e.x,e.y)};ol.appendChild(li)})});
chk.onclick=()=>{let bad=0,empty=0;Object.entries(cells).forEach(([k,o])=>{const v=o.inp.value.toUpperCase();o.c.classList.remove('ok','bad');if(!v){empty++;return}
 if(v==byKey[k].ch)o.c.classList.add('ok');else{o.c.classList.add('bad');bad++}});
 msg(bad?`Помилок: ${bad}`:empty?`Поки що без помилок, порожніх клітинок: ${empty}`:'Усе правильно!')};
hint.onclick=()=>{if(!cur)return msg('Спершу оберіть клітинку');const o=cells[key(cur.x,cur.y)];o.inp.value=byKey[key(cur.x,cur.y)].ch;o.c.classList.add('ok')};
rev.onclick=()=>{Object.entries(cells).forEach(([k,o])=>{o.inp.value=byKey[k].ch;o.c.classList.remove('bad');o.c.classList.add('ok')})};
(function(){const w=document.getElementById('wm');for(let y=60;y<1600;y+=380)for(let x=-100;x<1800;x+=640){const s=document.createElement('span');s.textContent='Акім Мамонтов 9-Б';s.style.left=(x+((Math.round(y/380)%2?320:0)))+'px';s.style.top=y+'px';w.appendChild(s)}})();
clr.onclick=()=>{Object.values(cells).forEach(o=>{o.inp.value='';o.c.classList.remove('ok','bad')});msg('')};
</script></body></html>
